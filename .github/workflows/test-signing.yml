name: Synthetic signing test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Create synthetic technical manifest
        run: |
          printf '%s\n' '{"app":"doble-ele-galerias","sequence":3,"schema":"gallery-schema22","bootstrap":1,"zip_sha256":"97cf1811284e7b36845419fc5e959be99eaa517c9967a3171d3ae0a2b1d15032","files":{"app/studio/synthetic.py":"43fc812049f1103348ee5f0ce3e84caaa8d87d55b2628164fdaee0be46015662","app/client/static/synthetic.css":"7598114f0ae3714f5cf8b92f682ccc052f04f93449f3ba90d6e211d003c30195"}}' > manifest-test.json
      - name: Sign and verify synthetic manifest
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1
        with:
          inputs: manifest-test.json
          verify: true
          verify-cert-identity: https://github.com/infodobleelestudio-afk/galerias-update-signing/.github/workflows/test-signing.yml@refs/heads/main
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          release-signing-artifacts: false
          upload-signing-artifacts: true
